# File de merge — aucun humain n'est requis : les trois checks `ci`, `a11y` et
# `ci-budget` sont la seule porte (`main` protégé, pas de push direct).
queue_rules:
  - name: default
    queue_conditions:
      - check-success = ci
      - check-success = a11y
      - check-success = ci-budget
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "10 seconds"
    max_checks_retries: 1
    checks_timeout: 5 min
    merge_method: rebase
    update_method: rebase

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  max_parallel_checks: 4

merge_protections_settings:
  auto_merge_conditions: true
